[package]
name = "onebrain-token"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
authors.workspace    = true
repository.workspace = true
publish.workspace    = true

[dependencies]
serde      = { workspace = true }
serde_json = { workspace = true }
chrono     = { workspace = true }
thiserror  = { workspace = true }
# Content-hash of the memoization key components (design §3a). Same version
# the rest of the workspace uses (onebrain-search / onebrain-fs).
sha2       = { workspace = true }
# Embedded KV store shared by Track 2's rollup tables (GAIN_DAILY/MONTHLY/
# YEARLY) and Track 3's memoization + already-sent ledger layers, all in
# `token.redb` — same version pin as onebrain-search's index store.
redb       = "4.1"

[dev-dependencies]
tempfile          = { workspace = true }
pretty_assertions = { workspace = true }
