[package]
name = "onebrain-search"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
authors.workspace    = true
repository.workspace = true
publish.workspace    = true

[dependencies]
serde      = { workspace = true }
serde_json = { workspace = true }
anyhow     = { workspace = true }
sha2       = { workspace = true }

# Full-text lexical search index. Defaults disabled to avoid the C zstd build
# dep pulled in by the (non-default) `zstd-compression` feature; re-enable
# only what's needed: `mmap` (memory-mapped index segments), `lz4-compression`
# (pure-Rust `lz4_flex`, no C dep), `stopwords` + `stemmer` (tokenizer support).
tantivy = { version = "0.26", default-features = false, features = [
    "mmap",
    "lz4-compression",
    "stopwords",
    "stemmer",
] }

# Thai word segmentation (nlpo3 NewmmTokenizer) is deferred: the published
# nlpo3 crate excludes its word dictionary (words_th.txt), so v3.4.0 uses a
# dictionary-free character-bigram fallback in `lex.rs`. Re-add `nlpo3` here
# once PyThaiNLP's word list is vendored (Phase 2 Thai upgrade).

# ONNX-backed local embedding models. Gated behind the `semantic` feature
# (default ON) so lex-only builds can be produced for platforms with no ONNX
# Runtime prebuilt (musl, ARM32, x86_64 macOS, arm64 Windows) — see
# docs/decisions/0017-platform-tiered-semantic-search.md.
#
# `default-features = false` + rustls features: fastembed's DEFAULT features are
# `hf-hub-native-tls` + `ort-download-binaries-native-tls`, which pull openssl-sys
# (breaks musl/ARM cross-compiles). The repo standardizes on rustls, so use the
# `-rustls-tls` variants. Dropping default features also drops `image-models`
# (rav1e/image codec tree) — we only use `TextEmbedding`, never the image APIs.
fastembed = { version = "5.17", default-features = false, features = [
    "hf-hub-rustls-tls",
    "ort-download-binaries-rustls-tls",
], optional = true }

# Explicit `hf-hub` dep for the reranker's own model download: fastembed only
# drives hf-hub downloads through `TextEmbedding`/`TextRerank::try_new`, not
# through the "bring your own model" path (`try_new_from_user_defined`) that
# `Reranker::new` uses, so this crate talks to hf-hub's sync `Api`/`ApiRepo`
# directly to fetch the ONNX + tokenizer files first. Same version fastembed
# already pulls in transitively (kept in sync via Cargo.lock) and the same
# rustls-only feature shape as `hf-hub-rustls-tls` above: `ureq` (required for
# the sync API — see hf-hub's `api::sync` module gate) + `rustls-tls` (no
# native-tls/openssl-sys, matching the rest of this crate).
hf-hub = { version = "0.5", default-features = false, features = [
    "ureq",
    "rustls-tls",
], optional = true }

# Memory-mapped file access for on-disk index/vector stores.
memmap2 = { workspace = true }

# Embedded KV store for chunk/doc metadata.
redb = "4.1"

# SIMD-accelerated vector similarity (cosine/dot/etc.) for the vector index.
# EXCLUDED on windows-arm64: after 8 release attempts, simsimd's C could not be
# compiled for aarch64-pc-windows-msvc — MSVC `cl` rejects its GCC-flavored
# dialect; clang-cl half-detects ARM so NEON paths miss `arm_neon.h`; disabling
# all SIMD then trips the Windows SDK's own arch detection in winnt.h
# (PSLIST_HEADER/PCONTEXT undefined). On that one target the crate uses the
# pure-Rust `dot_scalar` fallback in `vector.rs` (LLVM auto-vectorizes it).
# See ADR 0018 and the release.yml windows-arm64 history comment.
[target.'cfg(not(all(target_os = "windows", target_arch = "aarch64")))'.dependencies]
simsimd = "6.5"

[features]
# `semantic` (default ON) compiles the fastembed/ONNX-backed embedding path:
# the real `Embedder`, model download/switch, and vector/hybrid query ranking.
# WITHOUT it the crate still provides chunking, the lex/BM25 (tantivy) index,
# the portable vector store, the `Embed` trait + fake embedders, and the model
# registry metadata — so keyword search and the full index lifecycle work on
# platforms with no ONNX Runtime prebuilt. See ADR 0017.
default = ["semantic"]
semantic = ["dep:fastembed", "dep:hf-hub"]

[dev-dependencies]
tempfile = { workspace = true }
