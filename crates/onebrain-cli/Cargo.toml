[package]
name = "onebrain-cli"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
authors.workspace    = true
repository.workspace = true
publish.workspace    = true

[[bin]]
name = "onebrain"
path = "src/main.rs"

[dependencies]
onebrain-core  = { workspace = true }
onebrain-fs    = { workspace = true }
onebrain-cache = { workspace = true }
clap           = { workspace = true }
clap_complete  = { workspace = true }
serde          = { workspace = true }
serde_yaml     = { workspace = true }
serde_json     = { workspace = true }
anyhow         = { workspace = true }
chrono         = { workspace = true }
which          = { workspace = true }
dirs           = { workspace = true }
indicatif      = { workspace = true }
is-terminal    = { workspace = true }
# v3.3 daemon — structured file logging for the detached `daemon __run` child.
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc           = { workspace = true }
# v3.3 daemon — Unix-only syscalls (signal-0 liveness, SIGTERM, setsid).
# Windows builds skip this; the Windows daemon is a later step.
nix            = { workspace = true }

[dev-dependencies]
tempfile          = { workspace = true }
assert_cmd        = { workspace = true }
predicates        = { workspace = true }
insta             = { workspace = true }
pretty_assertions = { workspace = true }
flate2            = { workspace = true }
tar               = { workspace = true }
mockito           = { workspace = true }
