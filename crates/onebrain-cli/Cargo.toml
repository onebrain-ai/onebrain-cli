[package]
name = "onebrain-cli"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
authors.workspace    = true
repository.workspace = true
publish.workspace    = true

[[bin]]
name = "onebrain"
path = "src/main.rs"

[dependencies]
onebrain-core   = { workspace = true }
onebrain-fs     = { workspace = true }
onebrain-cache  = { workspace = true }
onebrain-token  = { workspace = true }
# The workspace dep pins `default-features = false`; onebrain-cli's own
# `semantic` feature (default ON, see [features] below) forwards to
# `onebrain-search/semantic`. So `cargo build -p onebrain-cli --no-default-features`
# produces a lex-only binary with no fastembed/ONNX dep — the tier used on
# release targets with no ONNX Runtime prebuilt (see ADR 0017).
onebrain-search = { workspace = true }
clap           = { workspace = true }
clap_complete  = { workspace = true }
serde          = { workspace = true }
serde_yaml     = { workspace = true }
serde_json     = { workspace = true }
sha2           = { workspace = true }
anyhow         = { workspace = true }
chrono         = { workspace = true }
which          = { workspace = true }
dirs           = { workspace = true }
indicatif      = { workspace = true }
is-terminal    = { workspace = true }
# Task 10p — interactive `search model` picker (Select) + re-embed confirm
# (Confirm). Reuses the same `inquire` workspace dep `onebrain-fs::init`
# already ships, so this adds zero new crates to the dependency graph.
inquire        = { workspace = true }
# v3.4 UX-2b — full-screen interactive `search model` TUI (registry table +
# sort/switch/delete keybindings). ratatui re-exports the crossterm backend it
# pins (`ratatui::crossterm`), so no separate crossterm dep is needed.
ratatui        = { workspace = true }
# Static `search model list` box — display-width math for ✓ ● — cells.
unicode-width  = { workspace = true }
# v3.3 daemon — structured file logging for the detached `daemon __run` child.
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
# v3.3 daemon step 2 — async HTTP surface (`serve` + `daemon __run`'s server).
# See the workspace [workspace.dependencies] comment for the binary-size note.
tokio              = { workspace = true }
axum               = { workspace = true }
tower              = { workspace = true }
tower-http         = { workspace = true }
# OS CSPRNG for the session auth token (server/token.rs) — every platform.
getrandom          = { workspace = true }
walkdir            = { workspace = true }
# v3.4 daemon — chat SSE stream (`stream!{}` body) + `Stream` trait in the handler.
async-stream       = { workspace = true }
futures-core       = { workspace = true }
# v3.4 daemon — internal webview preflight: a blocking ureq GET (headers only,
# body never read) run on `spawn_blocking` to decide if a URL may be iframed.
ureq               = { workspace = true }
# v3.3.27 daemon — translate bridge: URL query encoding for the Google gtx endpoint.
percent-encoding   = { workspace = true }
# v3.3.10 — embed the built web UI into the binary so `onebrain serve` ships a
# standalone UI (dist built by CI / scripts, NOT committed; see .gitignore).
# The `assets/` files are gzip-precompressed at build time (see the release
# workflow); `serve` detects the gzip magic bytes and returns them with
# `Content-Encoding: gzip` (the browser inflates), so the embed stays small
# WITHOUT any runtime-compression dependency — no rust-embed `compression`, which
# transitively drags an unused zstd C lib and hurts clean cross-compilation.
# Non-`assets/` files (index.html, version.json, changelog.json) stay raw.
rust-embed         = { version = "8", features = ["mime-guess"] }
# Pure-Rust gzip (miniz_oxide, no C) — inflate a precompressed embedded asset for
# the rare client that doesn't send `Accept-Encoding: gzip`. Already linked via
# onebrain-fs, so this adds no new crate.
flate2             = { workspace = true }
# MCP stdio server for `onebrain mcp` (pure Rust — no new `*-sys`/`cc` build deps,
# verified against main per ADR 0018). `schemars` is already transitive via
# rmcp's `server` feature; the direct dep only exposes the `JsonSchema` derive
# for the tools' structured (`Json<T>`) outputs.
rmcp               = { version = "2.1.0", features = ["server", "macros", "transport-io"] }
schemars           = "1.2.1"
# `onebrain mcp`'s `multi_get` tool: glob-match vault-relative paths walked via
# `walkdir` (already a direct dep above). Already in the workspace tree
# (pulled by `onebrain-fs` — pure Rust, no `-sys` crates), so this only
# promotes an existing transitive dep to direct rather than adding a new one.
globset            = { workspace = true }
# The session token (server::token) sources its bytes from `getrandom` (above)
# and hex-encodes them with a hand-rolled 1-liner rather than pulling the `hex`
# crate — a 32-char encode isn't worth a new dependency.

[features]
# `semantic` (default ON) forwards to `onebrain-search/semantic`, compiling the
# fastembed/ONNX-backed embedding path. Building `--no-default-features` yields a
# lex-only binary: `search search`/`get`/`status`/`reindex` work fully, `query`
# degrades to keyword ranking with a notice, and `vsearch`/`model set` error
# clearly. This is the release tier for platforms with no ONNX Runtime prebuilt
# (musl, ARM32, x86_64 macOS, arm64 Windows) — see ADR 0017. CI check:
# `cargo check -p onebrain-cli --no-default-features`.
default = ["semantic"]
semantic = ["onebrain-search/semantic"]

[target.'cfg(unix)'.dependencies]
libc           = { workspace = true }
# v3.3 daemon — Unix-only syscalls (signal-0 liveness, SIGTERM, setsid).
# Windows builds skip this; the Windows daemon is a later step.
nix            = { workspace = true }

[dev-dependencies]
tempfile          = { workspace = true }
# `token discover`'s `--since-days` test back-dates a fixture transcript's
# mtime (the filter is mtime-based, per plan 5.2 — no other reliable
# cross-platform way to control a file's mtime from a test).
filetime          = { workspace = true }
assert_cmd        = { workspace = true }
predicates        = { workspace = true }
insta             = { workspace = true }
# Integration tests reconstruct a daemon's per-vault slot filename
# (`daemon-<hash>.json`, #230), which the CLI derives via `short_path_hash`
# (sha256 of the canonical vault path, first 6 hex). Replicated here because the
# binary-only crate exposes no lib for tests to call it directly.
sha2              = { workspace = true }
pretty_assertions = { workspace = true }
tar               = { workspace = true }
mockito           = { workspace = true }
# Server handler tests drive the axum `Router` directly via `ServiceExt::oneshot`
# (no socket bind). `tower`'s `util` feature provides `oneshot`; the production
# `tower` dep stays feature-light. `http-body-util` collects the response body
# for assertions; `tokio` macros/rt power `#[tokio::test]`.
tower             = { workspace = true, features = ["util"] }
http-body-util    = "0.1"
tokio             = { workspace = true, features = ["rt", "macros"] }
# `open_lex_migrating`'s self-heal unit test builds a foreign-schema tantivy
# index by hand (mirrors onebrain-search's own
# `reopen_after_lex_schema_change_repopulates_from_meta` engine test) to
# simulate a pre-upgrade index on disk — this crate otherwise never touches
# tantivy directly (it's onebrain-search's dependency). Same version +
# feature set as onebrain-search's Cargo.toml so it unifies with the copy
# already pulled in transitively; adds no new crate to the dependency graph.
tantivy           = { version = "0.26", default-features = false, features = [
    "mmap",
    "lz4-compression",
    "stopwords",
    "stemmer",
] }
# The doctor `lex-index` underpopulated-state test plants a corrupt row
# directly in a collection's `engine.redb` `chunk_meta` table — the state a
# rebuild can only skip, never restore — which requires opening that table
# by hand. `onebrain_search`'s `CHUNK_META` const is crate-private, but redb
# identifies tables purely by name + key/value type, so a locally-defined
# `TableDefinition<&str, &str>` of the same name IS the same on-disk table.
# Same version as onebrain-search's Cargo.toml so it unifies with the copy
# already pulled in transitively; adds no new crate to the dependency graph.
redb              = "4.1"

# The prebuilt web UI release this binary embeds. The release workflow's
# `webui` job downloads `onebrain-webui-<version>-dist.tar.gz` from
# onebrain-ai/onebrain-webui's GitHub Releases and verifies it against this
# sha256 before embedding (see .github/workflows/release.yml). Bump BOTH
# fields together to ship a newer web UI.
[package.metadata.webui]
version = "v0.1.8"
sha256 = "8907f2505c5aa6c81e3c4dfe1140446e5d56ff88b302a2634bd059207e385695"
