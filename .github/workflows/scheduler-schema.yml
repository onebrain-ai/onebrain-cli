# Validate scheduler artifacts against the REAL OS scheduler.
#
# Reading a schema is not a gate. Two v3.4.20 review rounds put blockers into a
# spec because rendered documents were checked by eye: an <Environment> element
# that does not exist, a <DeleteExpiredTaskAfter> that never fires without an
# <EndBoundary>, and a <Months> omission that silently turns "1 March" into
# "the 1st of every month".
#
# This job feeds tests/scheduler-corpus/ to the scheduler itself. Filename
# encodes the expectation:
#   accept-*  the OS must accept it; a companion accept-*.expect pins how the OS
#             INTERPRETED it (regex matched against the query output), because
#             "installs cleanly" and "means what we meant" are different claims.
#   reject-*  the OS must reject it. An acceptance also fails: reject- cases pin
#             limitations the renderer is designed around, so one that starts
#             passing means the design is avoiding a constraint that is gone.
#
# Fast and hermetic — it proves documents are well-formed and installable.
# It does NOT prove a job fires; that is windows-schedule-fires (Windows) and a
# manual VM run (Linux, see the v3.4.20 dashboard waiver).
name: scheduler-schema

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Both jobs only check out the repo and run local tools — nothing writes to the
# repository, and nothing needs an API token. Matches ci.yml.
permissions:
  contents: read

jobs:
  windows-roundtrip:
    name: Task Scheduler round-trip
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Round-trip the corpus through schtasks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $corpus = 'tests/scheduler-corpus/windows'
          $work = Join-Path $env:RUNNER_TEMP 'corpus'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $user = "$env:USERDOMAIN\$env:USERNAME"
          $failures = @()

          Get-ChildItem "$corpus/*.xml" | Sort-Object Name | ForEach-Object {
            $name = $_.BaseName
            $mustAccept = $name.StartsWith('accept-')
            $tn = "\OneBrainCorpus\$name"

            # UTF-16 is what Task Scheduler expects; the corpus keeps the
            # placeholder so the file is not tied to one machine's account.
            $xml = (Get-Content $_.FullName -Raw) -replace '__USER__', $user
            $path = Join-Path $work "$name.xml"
            [System.IO.File]::WriteAllText($path, $xml, [System.Text.Encoding]::Unicode)

            $out = & schtasks /Create /XML $path /TN $tn /F 2>&1
            $accepted = ($LASTEXITCODE -eq 0)
            $verdict = if ($accepted -eq $mustAccept) { 'ok' } else { 'FAIL' }
            Write-Host ("{0,-44} expect={1,-6} got={2,-6} {3}" -f `
              $name, $(if ($mustAccept) {'accept'} else {'reject'}), `
              $(if ($accepted) {'accept'} else {'reject'}), $verdict)
            if ($verdict -eq 'FAIL') {
              $failures += "$name :: $(($out -join ' ').Trim())"
            }

            if ($accepted) {
              # If the case pins an interpretation, check it. A document can
              # install cleanly and still mean something else entirely.
              $expectFile = Join-Path $corpus "$name.expect"
              if (Test-Path $expectFile) {
                $pattern = (Get-Content $expectFile -Raw).Trim()
                $query = (& schtasks /Query /TN $tn /V /FO LIST 2>&1) -join "`n"
                if ($query -match $pattern) {
                  Write-Host "    interpretation ok :: /$pattern/"
                } else {
                  Write-Host "    interpretation FAIL :: /$pattern/ did not match"
                  $failures += "$name :: interpretation /$pattern/ not matched"
                  ($query -split "`n" | Select-String 'Next Run Time|Months|Days|Schedule') |
                    ForEach-Object { Write-Host "      $_" }
                }
              }
              & schtasks /Delete /TN $tn /F 2>&1 | Out-Null
            }
          }

          if ($failures.Count -gt 0) {
            Write-Host "`n$($failures.Count) case(s) failed:"
            $failures | ForEach-Object { Write-Host "  - $_" }
            exit 1
          }
          Write-Host "`nall cases behaved as pinned"
          # Explicit, and load-bearing: GitHub appends `exit $LASTEXITCODE` to
          # every pwsh step. The last external command here is the `schtasks`
          # call for a reject- case, which is SUPPOSED to be non-zero — without
          # this the step fails while reporting that every case passed.
          exit 0

  macos-launchd-roundtrip:
    name: launchd round-trip
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Round-trip the corpus through launchd
        # NOT plain `shell: bash` — the default carries -e, and every reject-
        # case is non-zero by design.
        shell: bash --noprofile --norc {0}
        run: |
          set -uo pipefail
          corpus=tests/scheduler-corpus/macos
          work="$RUNNER_TEMP/corpus"; mkdir -p "$work"
          uid=$(id -u)
          failures=0

          # Bootstrapping into the real gui/<uid> domain is safe HERE and only
          # here: a throwaway runner has no user schedules to clobber. The same
          # thing on a developer's Mac would boot out their real jobs, which is
          # why the equivalent unit tests are #[ignore]d.
          for f in "$corpus"/*.plist; do
            name=$(basename "$f" .plist)
            case "$name" in
              accept-*) expect=accept ;;
              reject-*) expect=reject ;;
              *) echo "corpus file with no accept-/reject- prefix: $name"; failures=$((failures+1)); continue ;;
            esac

            label="onebrain-corpus-$name-$$"
            sed "s|__LABEL__|$label|" "$f" > "$work/$label.plist"

            # Syntax first: plutil is cheap and its message is far clearer than
            # launchd's when a document is simply malformed.
            if ! plutil -lint "$work/$label.plist" >/dev/null 2>&1; then
              got=reject
            else
              launchctl bootout "gui/$uid/$label" >/dev/null 2>&1
              if launchctl bootstrap "gui/$uid" "$work/$label.plist" >/dev/null 2>&1; then
                got=accept
              else
                got=reject
              fi
            fi

            verdict=$([ "$got" = "$expect" ] && echo ok || echo FAIL)
            printf '%-40s expect=%-6s got=%-6s %s\n' "$name" "$expect" "$got" "$verdict"
            [ "$verdict" = FAIL ] && failures=$((failures+1))

            if [ "$got" = accept ]; then
              # Pin the INTERPRETATION, not just that it loaded. launchd prints
              # the calendar interval back, which is the closest thing it has to
              # the Windows query output.
              expectFile="$corpus/$name.expect"
              if [ -f "$expectFile" ]; then
                pattern=$(cat "$expectFile")
                printed=$(launchctl print "gui/$uid/$label" 2>&1)
                if echo "$printed" | grep -qE "$pattern"; then
                  echo "    interpretation ok :: /$pattern/"
                else
                  echo "    interpretation FAIL :: /$pattern/ did not match"
                  failures=$((failures+1))
                  echo "$printed" | grep -iE 'calendar|weekday|day|hour|minute' | sed 's/^/      /' | head -12
                fi
              fi
              launchctl bootout "gui/$uid/$label" >/dev/null 2>&1
            fi
          done

          if [ "$failures" -gt 0 ]; then
            echo; echo "$failures case(s) failed"; exit 1
          fi
          echo; echo "all cases behaved as pinned"

  linux-unit-verify:
    name: systemd unit verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Verify the corpus with systemd-analyze
        # NOT plain `shell: bash` — GitHub's default adds `-e`, which kills the
        # script at the first non-zero `systemd-analyze verify`. Every reject-
        # case is non-zero BY DESIGN, so `-e` makes the corpus's own negative
        # cases abort the run before a single one is evaluated.
        shell: bash --noprofile --norc {0}
        run: |
          set -uo pipefail
          corpus=tests/scheduler-corpus/linux
          work="$RUNNER_TEMP/corpus"
          mkdir -p "$work"
          failures=0

          # systemd-analyze verify is STATIC — it needs no user session and no
          # D-Bus, so it runs here even though `systemctl --user` cannot. That is
          # why Linux gets a real CI check despite the fire-proof being waived.
          systemd-analyze --version | head -1

          # verify resolves unit names against the directory it is given, so
          # copy the pair in together and check by path.
          cp "$corpus"/* "$work"/

          for f in "$corpus"/*.service "$corpus"/*.timer; do
            name=$(basename "$f")
            case "$name" in
              accept-*) expect=accept ;;
              reject-*) expect=reject ;;
              *) echo "corpus file with no accept-/reject- prefix: $name"; failures=$((failures+1)); continue ;;
            esac

            out=$(systemd-analyze verify "$work/$name" 2>&1)
            rc=$?
            got=$([ $rc -eq 0 ] && echo accept || echo reject)
            verdict=$([ "$got" = "$expect" ] && echo ok || echo FAIL)
            printf '%-44s expect=%-6s got=%-6s %s\n' "$name" "$expect" "$got" "$verdict"
            if [ "$verdict" = FAIL ]; then
              failures=$((failures+1))
              echo "$out" | sed 's/^/    /'
            fi
          done

          if [ "$failures" -gt 0 ]; then
            echo
            echo "$failures case(s) failed"
            exit 1
          fi
          echo
          echo "all cases behaved as pinned"
