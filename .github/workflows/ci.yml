name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Fails the build on a broken doc link or a stale reference-doc source path.
  # Pure-stdlib Python (no third-party action → no new supply-chain surface); the
  # checker understands the reference docs' crate-relative `src/…` convention.
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/check-links.py

  # Fails the build when the README Quickstart's `# → onebrain <ver>` example
  # drifts from the workspace Cargo.toml version — the recurring stale-README
  # miss on every release bump. Pure-stdlib Python (no third-party action),
  # same guard style as `links` above. Fast: no toolchain, just a file read.
  readme-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/check-readme-version.py

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # Lex-only tier gate: the `--no-default-features` build drops the `semantic`
  # feature (no fastembed / ONNX runtime) and is what ships on release targets
  # with no ONNX Runtime prebuilt (musl, ARM32, x86_64 macOS —
  # see docs/decisions/0017-platform-tiered-semantic-search.md and the tier
  # table in .github/workflows/release.yml). This keeps that build compiling +
  # clippy-clean so a lex-only release target can't silently break on `main`.
  lex-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p onebrain-cli -p onebrain-search --no-default-features --all-targets -- -D warnings
      # Also RUN the lex-only tests, not just clippy — the semantic-off code
      # paths (e.g. the MCP `query` tool's vec/hyde degradation, `vsearch`
      # unavailability, `semantic_available: false`) are only executed here.
      # Without this, those branches compile but never run in any CI job (#119).
      - run: cargo test -p onebrain-cli -p onebrain-search --no-default-features --no-fail-fast

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      # macOS: simsimd's build script bakes the active Xcode's clang runtime
      # dir (…/lib/clang/<ver>/lib/darwin, for -lclang_rt.osx) into its cached
      # output. When the runner image rotates Xcode versions, a restored cache
      # points at a path that no longer exists → `ld: library 'clang_rt.osx'
      # not found`. Key the cache by Xcode version so caches never cross
      # images, and export the CURRENT runtime dir as a fallback search path.
      - name: Key cache by Xcode version (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "RUST_CACHE_KEY=$(xcodebuild -version | head -1 | tr -d ' ')" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$(cd "$(dirname "$(xcrun -f clang)")/../lib/clang" && echo "$PWD"/*/lib/darwin)" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.RUST_CACHE_KEY }}
      - run: cargo test --workspace --no-fail-fast

  # Ratchet coverage gate — fails if core line coverage drops below the
  # threshold in scripts/coverage.sh (CORE_LINE_THRESHOLD). Measured on Linux
  # only (one canonical surface); the threshold absorbs platform jitter. See
  # docs/coverage.md for the exclusion allowlist + documented residuals.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/coverage.sh --ci-gate
  # NOTE: the `parity` job (byte-for-byte stdout comparison between the v2.x
  # Bun reference binary and the v3.x Rust port) was retired in v3.1.0.
  # v3.0.0 shipped GA 2026-05-22; the Bun-era release binaries are no longer
  # published on github.com/onebrain-ai/onebrain — only the npm package
  # `@onebrain-ai/cli@2.4.x` remains, marked deprecated. The Rust port has
  # its own canonical contract (Envelope shape · snapshot tests in
  # `tests/v31_envelope_snapshots.rs` · `tests/output_format_matrix.rs`);
  # regressions against the v2 wire format are no longer the active concern.

  # Fire-proof: a task registered through the real Windows backend actually
  # RUNS, and a one-shot deletes itself. The regression guard for "installs
  # cleanly, never fires" — the failure class that motivated v3.4.20.
  # Own job, not in the test matrix: it sleeps for minutes and is
  # Windows-only; burying it there would make every platform wait.
  # scheduler-schema.yml's header comment forward-references this job.
  windows-schedule-fires:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p onebrain-cli --test windows_schedule_fires -- --ignored --nocapture
