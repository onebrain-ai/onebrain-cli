name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --no-fail-fast

  parity:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Download pinned Bun v2.3.3 binary
        # Upstream publishes a raw single-file binary, not a tarball — earlier
        # config asked for `.tar.gz` and got a 404 on every PR. The v2.3.3
        # release on onebrain-ai/onebrain has assets like onebrain-linux-x64
        # (no extension); curl it directly + chmod +x. No untrusted input is
        # interpolated into this run script.
        run: |
          curl -fsSL \
            https://github.com/onebrain-ai/onebrain/releases/download/v2.3.3/onebrain-linux-x64 \
            -o /tmp/onebrain-bun-v2.3.3
          chmod +x /tmp/onebrain-bun-v2.3.3
      - name: Build Rust release binary
        run: cargo build --release -p onebrain-cli
      - name: Run parity suite
        env:
          BUN_BINARY: /tmp/onebrain-bun-v2.3.3
          RUST_BINARY: ${{ github.workspace }}/target/release/onebrain
        run: cargo test -p parity --release
