name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            apt: musl-tools
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            archive: zip
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install musl tools
        if: matrix.apt
        env:
          APT_PACKAGES: ${{ matrix.apt }}
        run: sudo apt-get update && sudo apt-get install -y "$APT_PACKAGES"

      - name: Install aarch64 linux cross-compiler
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          {
            echo '[target.aarch64-unknown-linux-gnu]'
            echo 'linker = "aarch64-linux-gnu-gcc"'
          } >> .cargo/config.toml

      - name: Build release binary
        shell: bash
        run: cargo build --release --target "$TARGET" -p onebrain-cli

      - name: Strip binary (native Unix)
        if: matrix.archive == 'tar.gz' && !matrix.cross
        shell: bash
        run: strip "target/$TARGET/release/onebrain"

      - name: Strip aarch64 linux binary
        if: matrix.cross
        shell: bash
        run: aarch64-linux-gnu-strip "target/$TARGET/release/onebrain"

      - name: Package tar.gz + sha256
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist
          ARCHIVE="onebrain-${TARGET}.tar.gz"
          tar -czf "dist/$ARCHIVE" -C "target/${TARGET}/release" onebrain
          ( cd dist && shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256" )

      - name: Package zip + sha256 (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $archive = "onebrain-$env:TARGET.zip"
          Compress-Archive `
            -Path "target/$env:TARGET/release/onebrain.exe" `
            -DestinationPath "dist/$archive"
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$archive").Hash.ToLower()
          "$hash  $archive" | Out-File -Encoding ascii "dist/$archive.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: onebrain-${{ matrix.target }}
          path: dist/

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Determine version + prerelease flag
        id: meta
        env:
          REF: ${{ github.ref }}
        shell: bash
        run: |
          VERSION="${REF#refs/tags/}"
          case "$VERSION" in
            *-alpha*|*-beta*|*-rc*) PRERELEASE=true ;;
            *) PRERELEASE=false ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release (auto-generated notes)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          ARGS=()
          if [ "$PRERELEASE" = "true" ]; then
            ARGS+=(--prerelease)
          fi
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            "${ARGS[@]}" \
            artifacts/*

      # Prepend a friendly platform-downloads table so non-Rust users can pick the
      # right asset without decoding Rust target triples. Asset filenames keep
      # their canonical triples (cargo-binstall + custom installer scripts parse
      # them automatically). Only env-injected vars are used in run scripts — no
      # untrusted user input is interpolated.
      - name: Prepend platform downloads table to release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          ORIGINAL=$(gh release view "$VERSION" --json body --jq .body)
          {
            echo "## Downloads"
            echo
            echo "| Platform | Architecture | File |"
            echo "|---|---|---|"
            echo "| ![macOS](https://img.shields.io/badge/macOS-000000?logo=apple&logoColor=white&style=flat) | Apple Silicon (M1–M5) | \`onebrain-aarch64-apple-darwin.tar.gz\` |"
            echo "| ![macOS](https://img.shields.io/badge/macOS-000000?logo=apple&logoColor=white&style=flat) | Intel | \`onebrain-x86_64-apple-darwin.tar.gz\` |"
            echo "| ![Linux](https://img.shields.io/badge/Linux-FCC624?logo=linux&logoColor=black&style=flat) (glibc) | ARM64 | \`onebrain-aarch64-unknown-linux-gnu.tar.gz\` |"
            echo "| ![Linux](https://img.shields.io/badge/Linux-FCC624?logo=linux&logoColor=black&style=flat) (glibc) | x86_64 | \`onebrain-x86_64-unknown-linux-gnu.tar.gz\` |"
            echo "| ![Linux](https://img.shields.io/badge/Linux-FCC624?logo=linux&logoColor=black&style=flat) (musl / Alpine / static) | x86_64 | \`onebrain-x86_64-unknown-linux-musl.tar.gz\` |"
            echo "| ![Windows](https://img.shields.io/badge/Windows-0078D4?logo=windows&logoColor=white&style=flat) | ARM64 | \`onebrain-aarch64-pc-windows-msvc.zip\` |"
            echo "| ![Windows](https://img.shields.io/badge/Windows-0078D4?logo=windows&logoColor=white&style=flat) | x86_64 | \`onebrain-x86_64-pc-windows-msvc.zip\` |"
            echo
            echo "Each binary ships with a matching \`.sha256\` checksum. Filenames use canonical Rust target triples — \`cargo-binstall\` and other tooling auto-parse them."
            echo
            echo "---"
            echo
            echo "$ORIGINAL"
          } > /tmp/release-body.md
          gh release edit "$VERSION" --notes-file /tmp/release-body.md
