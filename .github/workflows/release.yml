name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Fetch the PREBUILT web UI dist and share it to every platform's binary
  # build, which embeds it via rust-embed (see server/static.rs `WebAssets`).
  # The dist is built exactly once, by onebrain-webui's own release workflow
  # (every merged version lands as a GH Release tarball + sha256); this job
  # downloads the release pinned in crates/onebrain-cli/Cargo.toml under
  # `[package.metadata.webui]` and verifies its sha256 against that pin —
  # reproducible (re-running an old tag embeds the same webui) and minutes
  # faster than rebuilding from source. Bump the pin to ship a newer webui.
  webui:
    name: Fetch prebuilt web UI
    runs-on: ubuntu-latest
    permissions:
      contents: read # download-only job — override the workflow-wide write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - name: download pinned dist release + verify sha256
        run: |
          set -euo pipefail
          # Pin lives in the consuming crate's manifest: [package.metadata.webui]
          # with `version = "vX.Y.Z"` and `sha256 = "<64 hex>"`.
          MANIFEST="crates/onebrain-cli/Cargo.toml"
          PIN_V="$(awk -F'"' '/^\[package\.metadata\.webui\]/{f=1;next} /^\[/{f=0} f && $1 ~ /^version[ \t]*=[ \t]*$/ {print $2; exit}' "$MANIFEST")"
          PIN_SHA="$(awk -F'"' '/^\[package\.metadata\.webui\]/{f=1;next} /^\[/{f=0} f && $1 ~ /^sha256[ \t]*=[ \t]*$/ {print $2; exit}' "$MANIFEST")"
          if ! printf '%s' "$PIN_V" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "webui pin (Cargo.toml metadata) has a suspicious version: $PIN_V" >&2; exit 1
          fi
          if ! printf '%s' "$PIN_SHA" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "webui pin (Cargo.toml metadata) has a malformed sha256: $PIN_SHA" >&2; exit 1
          fi
          ART="onebrain-webui-${PIN_V}-dist.tar.gz"
          gh release download "$PIN_V" --repo onebrain-ai/onebrain-webui --pattern "$ART"
          echo "$PIN_SHA  $ART" | sha256sum -c -
          mkdir dist
          tar -xzf "$ART" -C dist
          echo "Embedding webui $PIN_V ($(du -sh dist | cut -f1))"
      - uses: actions/upload-artifact@v7
        with:
          name: webui-dist
          path: dist/
          retention-days: 1

  build:
    name: Build ${{ matrix.target }}
    needs: webui
    # Platform-tiered semantic search (ADR 0017). The `semantic` cargo feature
    # (default ON) compiles the fastembed/ONNX-backed embedding path. It can
    # only build on targets that have an ONNX Runtime prebuilt — the SINGLE
    # SOURCE OF TRUTH is ort-sys 2.0.0-rc.12's `build/download/dist.txt` for our
    # feature set (`none`: no CUDA/webgpu). This table, ADR 0017's tier table,
    # and the README platform-support matrix are all derived from that list and
    # MUST agree. Targets without a prebuilt build lex-only via
    # `cargo_flags: --no-default-features` (keyword search + full CLI, no
    # semantic verbs). Tier per release target:
    #
    #   Target                           ONNX prebuilt (ort `none`)  Tier
    #   ────────────────────────────────────────────────────────────────────
    #   aarch64-apple-darwin             ✅ yes                       semantic
    #   x86_64-apple-darwin              ❌ no                        lex-only
    #   aarch64-unknown-linux-gnu        ✅ yes                       semantic
    #   armv7-unknown-linux-gnueabihf    ❌ no (ARM32, impossible)    lex-only
    #   arm-unknown-linux-gnueabihf      ❌ no (ARM32, impossible)    lex-only
    #   x86_64-unknown-linux-gnu         ✅ yes                       semantic
    #   x86_64-unknown-linux-musl        ❌ no (gnu only, not musl)   lex-only
    #   x86_64-pc-windows-msvc           ✅ yes                       semantic
    #   aarch64-pc-windows-msvc          ✅ yes                       semantic
    #
    # `cargo_flags` is spliced into the build command below; absent = default
    # (semantic) build. Only matrix-controlled values are interpolated — no
    # untrusted input flows into the run scripts.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
            cargo_flags: --no-default-features
          # Linux cross-compile: matrix value `cross_prefix` is the toolchain
          # triple used to derive (a) the apt package `gcc-${cross_prefix}`,
          # (b) the linker `${cross_prefix}-gcc`, and (c) the strip binary
          # `${cross_prefix}-strip`. cross_prefix matches the GNU toolchain
          # naming, NOT the Rust target triple. Only matrix-controlled values
          # are interpolated; no untrusted input flows into the run scripts.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross_prefix: aarch64-linux-gnu
          - target: armv7-unknown-linux-gnueabihf
            os: ubuntu-latest
            archive: tar.gz
            cross_prefix: arm-linux-gnueabihf
            cargo_flags: --no-default-features
          - target: arm-unknown-linux-gnueabihf
            os: ubuntu-latest
            archive: tar.gz
            cross_prefix: arm-linux-gnueabihf
            cargo_flags: --no-default-features
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            apt: musl-tools
            cargo_flags: --no-default-features
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            archive: zip
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install musl tools
        if: matrix.apt
        env:
          APT_PACKAGES: ${{ matrix.apt }}
        run: sudo apt-get update && sudo apt-get install -y "$APT_PACKAGES"

      - name: Install Linux cross-compiler
        if: matrix.cross_prefix
        env:
          CROSS_PREFIX: ${{ matrix.cross_prefix }}
          TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update
          # gcc-* installs the compiler. binutils-* installs ld + strip + ar.
          # Don't drop binutils — gcc-arm-linux-gnueabihf in particular does
          # NOT depend on its matching binutils, and the strip step below
          # would fail with command-not-found on a fresh runner image.
          # g++-* provides the cross libstdc++ (libstdc++.so) the linker needs:
          # the semantic tier links onnxruntime's prebuilt, which pulls in the
          # C++ runtime (-lstdc++). Without it aarch64-unknown-linux-gnu fails
          # with `ld: cannot find -lstdc++`. Harmless for the lex-only ARM32
          # targets (they don't link onnxruntime), so install it uniformly.
          sudo apt-get install -y "gcc-${CROSS_PREFIX}" "g++-${CROSS_PREFIX}" "binutils-${CROSS_PREFIX}"
          mkdir -p .cargo
          {
            echo "[target.${TARGET}]"
            echo "linker = \"${CROSS_PREFIX}-gcc\""
          } >> .cargo/config.toml

      # aarch64-pc-windows-msvc builds on a native ARM64 runner (windows-11-arm),
      # but nothing in the job activates an MSVC dev environment, so simsimd's
      # build.rs (which uses the `cc` crate to compile its C via cl.exe) can't
      # reliably locate an arm64-targeting cl.exe. When the C compile silently
      # produces no object, the final link fails with
      # `LNK1181: cannot open input file 'simsimd.lib'`. This step activates the
      # native arm64 MSVC toolset (host arm64 → target arm64), which `cc` honours
      # through the standard MSVC env vars — so simsimd.lib is produced. Scoped to
      # this one target.
      - name: Set up arm64 MSVC environment
        if: matrix.target == 'aarch64-pc-windows-msvc'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Fetch the embedded web UI
        uses: actions/download-artifact@v7
        with:
          name: webui-dist
          path: crates/onebrain-cli/webui/

      # Gzip the web UI's hashed assets in place so the embed stays small and
      # `serve` can ship them with Content-Encoding: gzip (see server::static).
      # Idempotent; runs on every target (bash + gzip are present on all runners,
      # incl. Windows git-bash).
      - name: Gzip embedded web UI assets
        shell: bash
        run: bash scripts/gzip-embed-assets.sh

      - name: Build release binary
        shell: bash
        # CARGO_FLAGS is `--no-default-features` for lex-only tier targets (no
        # ONNX Runtime prebuilt), empty otherwise — see the tier table on the
        # matrix above. Matrix-controlled value; intentionally word-split (not
        # quoted) so an empty value expands to nothing.
        env:
          CARGO_FLAGS: ${{ matrix.cargo_flags }}
        run: cargo build --release --target "$TARGET" -p onebrain-cli $CARGO_FLAGS

      - name: Strip binary (native Unix)
        if: matrix.archive == 'tar.gz' && !matrix.cross_prefix
        shell: bash
        run: strip "target/$TARGET/release/onebrain"

      - name: Strip cross-compiled Linux binary
        if: matrix.cross_prefix
        env:
          CROSS_PREFIX: ${{ matrix.cross_prefix }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          "${CROSS_PREFIX}-strip" "target/${TARGET}/release/onebrain"

      - name: Package tar.gz + sha256
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist
          ARCHIVE="onebrain-${TARGET}.tar.gz"
          tar -czf "dist/$ARCHIVE" -C "target/${TARGET}/release" onebrain
          ( cd dist && shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256" )

      - name: Package zip + sha256 (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $archive = "onebrain-$env:TARGET.zip"
          Compress-Archive `
            -Path "target/$env:TARGET/release/onebrain.exe" `
            -DestinationPath "dist/$archive"
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$archive").Hash.ToLower()
          "$hash  $archive" | Out-File -Encoding ascii "dist/$archive.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: onebrain-${{ matrix.target }}
          path: dist/

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          # Only the per-platform binary artifacts (onebrain-<target>) become
          # release assets. WITHOUT this pattern, merge-multiple also pulls in the
          # `webui-dist` artifact (built for the embed step), flattening its
          # index.html + assets/ dir into artifacts/ — and `gh release ... artifacts/*`
          # then chokes on the directory ("read artifacts/assets: is a directory").
          pattern: onebrain-*
          path: artifacts
          merge-multiple: true

      - name: Determine version + prerelease flag
        id: meta
        env:
          REF: ${{ github.ref }}
        shell: bash
        run: |
          VERSION="${REF#refs/tags/}"
          case "$VERSION" in
            *-alpha*|*-beta*|*-rc*) PRERELEASE=true ;;
            *) PRERELEASE=false ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release (auto-generated notes)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          ARGS=()
          if [ "$PRERELEASE" = "true" ]; then
            ARGS+=(--prerelease)
          fi
          # Idempotent: a re-tag (delete + re-push the same vX.Y.Z to recover
          # from a downstream job failure) re-runs this job against an already
          # existing release. `gh release create` errors on an existing tag, so
          # branch: upload-with-clobber when the release exists, create fresh
          # otherwise. Asset filenames are stable so --clobber overwrites in
          # place rather than duplicating.
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" artifacts/* --clobber
          else
            gh release create "$VERSION" \
              --title "$VERSION" \
              --generate-notes \
              "${ARGS[@]}" \
              artifacts/*
          fi

      # Prepend a friendly platform-downloads table so non-Rust users can pick the
      # right asset without decoding Rust target triples. Asset filenames keep
      # their canonical triples (cargo-binstall + custom installer scripts parse
      # them automatically). Only env-injected vars are used in run scripts — no
      # untrusted user input is interpolated.
      - name: Prepend platform downloads table to release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          ORIGINAL=$(gh release view "$VERSION" --json body --jq .body)
          {
            echo "## Downloads"
            echo
            echo "| Platform | Architecture | File |"
            echo "|---|---|---|"
            echo "| ![macOS](https://img.shields.io/badge/macOS-000000?logo=apple&logoColor=white&style=flat) | Apple Silicon (M1–M5) | \`onebrain-aarch64-apple-darwin.tar.gz\` |"
            echo "| ![macOS](https://img.shields.io/badge/macOS-000000?logo=apple&logoColor=white&style=flat) | Intel | \`onebrain-x86_64-apple-darwin.tar.gz\` |"
            echo "| ![Linux](https://img.shields.io/badge/Linux-FCC624?logo=linux&logoColor=black&style=flat) | ARM64 (glibc · Pi 3/4/5 64-bit OS · Pi Zero 2 W) | \`onebrain-aarch64-unknown-linux-gnu.tar.gz\` |"
            echo "| ![Linux](https://img.shields.io/badge/Linux-FCC624?logo=linux&logoColor=black&style=flat) | ARMv7 32-bit (Pi 2 v1.1+ · Pi 3/4/5 32-bit OS) | \`onebrain-armv7-unknown-linux-gnueabihf.tar.gz\` |"
            echo "| ![Linux](https://img.shields.io/badge/Linux-FCC624?logo=linux&logoColor=black&style=flat) | ARMv6 32-bit (Pi 1 · Pi Zero · Pi Zero W) | \`onebrain-arm-unknown-linux-gnueabihf.tar.gz\` |"
            echo "| ![Linux](https://img.shields.io/badge/Linux-FCC624?logo=linux&logoColor=black&style=flat) | x86_64 (glibc) | \`onebrain-x86_64-unknown-linux-gnu.tar.gz\` |"
            echo "| ![Linux](https://img.shields.io/badge/Linux-FCC624?logo=linux&logoColor=black&style=flat) | x86_64 (musl / Alpine / static) | \`onebrain-x86_64-unknown-linux-musl.tar.gz\` |"
            echo "| ![Windows](https://img.shields.io/badge/Windows-0078D4?logo=windows&logoColor=white&style=flat) | ARM64 | \`onebrain-aarch64-pc-windows-msvc.zip\` |"
            echo "| ![Windows](https://img.shields.io/badge/Windows-0078D4?logo=windows&logoColor=white&style=flat) | x86_64 | \`onebrain-x86_64-pc-windows-msvc.zip\` |"
            echo
            echo "Each binary ships with a matching \`.sha256\` checksum. Filenames use canonical Rust target triples — \`cargo-binstall\` and other tooling auto-parse them."
            echo
            echo "---"
            echo
            echo "$ORIGINAL"
          } > /tmp/release-body.md
          gh release edit "$VERSION" --notes-file /tmp/release-body.md

  npm-publish:
    name: Publish npm wrapper
    needs: release
    runs-on: ubuntu-latest
    # Skip prereleases — only stable `vMAJOR.MINOR.PATCH` tags get published to
    # the npm registry. Any tag with `-` in the version is considered a
    # prerelease (semver convention covers `-alpha.N`, `-beta.N`, `-rc.N`,
    # `-canary`, `-dev`, `-next`, `-preview`, `-snapshot`, etc. with a single
    # rule). Prereleases still produce GitHub Release artifacts so users on
    # `cargo binstall` / brew tap / direct download paths can pick them up;
    # the npm wrapper just doesn't track them.
    if: ${{ !contains(github.ref, '-') }}
    permissions:
      contents: read
      # Required for npm Trusted Publishers (OIDC). With the matching
      # publisher configured on npmjs.com (one-time UI setup against this
      # repo + workflow), `npm publish --provenance` exchanges a short-lived
      # OIDC token for publish rights — no long-lived NPM_TOKEN secret to
      # rotate. The publish attestation also gets recorded by Sigstore.
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # OIDC Trusted Publishing requires npm CLI >= 11.5.1. Node 20 ships
      # npm 10.8.x, which silently falls back to the setup-node placeholder
      # `_authToken` in ~/.npmrc and gets a 404 on the scoped PUT — even with
      # a correctly configured trusted publisher. Upgrading npm here is what
      # actually activates the OIDC token exchange (id-token: write above).
      - name: Upgrade npm to a version that supports OIDC trusted publishing
        run: npm install -g npm@latest

      # Single source of version truth = the git tag. The committed
      # `npm-wrapper/package.json` version is a placeholder for local dev
      # (`npm pack`, `npm install ./npm-wrapper`) and is rewritten in CI
      # before publish so the wrapper version always equals the binary
      # release version. `--allow-same-version` lets the first publish at a
      # given tag succeed even if the checked-in value already matches.
      # `github.ref` is read via env (safe pattern — never interpolated
      # directly into run scripts).
      - name: Sync wrapper version to git tag
        working-directory: npm-wrapper
        env:
          REF: ${{ github.ref }}
        run: |
          VERSION="${REF#refs/tags/v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Publish to npm with provenance
        working-directory: npm-wrapper
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          VERSION="${REF#refs/tags/v}"
          # Idempotent: a recovery re-tag of an already-published version
          # would otherwise hit npm's "cannot publish over existing version"
          # (403) and fail the whole release. Skip cleanly if this exact
          # version is already on the registry.
          if npm view "@onebrain-ai/cli@${VERSION}" version >/dev/null 2>&1; then
            echo "npm: @onebrain-ai/cli@${VERSION} already published — skipping"
            exit 0
          fi
          npm publish --access public --provenance

  brew-bump:
    name: Bump Homebrew formula
    needs: release
    runs-on: ubuntu-latest
    # Stable tags only — prereleases don't update the brew tap (matches the
    # npm-publish gate). Requires the `HOMEBREW_TAP_TOKEN` secret: a
    # fine-grained PAT scoped to `onebrain-ai/homebrew-onebrain` with
    # contents:read+write. GITHUB_TOKEN can't write to a sibling repo.
    if: ${{ !contains(github.ref, '-') }}
    permissions:
      contents: read
    steps:
      - name: Regenerate + commit formula
        env:
          # Two-token split: the release lives on THIS repo (onebrain-cli),
          # readable with the workflow's own GITHUB_TOKEN. The tap commit
          # targets a SIBLING repo (homebrew-onebrain) which GITHUB_TOKEN
          # can't write — that needs the fine-grained HOMEBREW_TAP_TOKEN.
          # The tap token is scoped to homebrew-onebrain only, so reusing it
          # for the cross-repo release read fails with "Resource not
          # accessible by personal access token".
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # `github.ref_name` is the bare tag (vX.Y.Z). Strip the leading v
          # for the brew `version` (Homebrew also auto-derives it from the
          # URL, but we keep the tag form for the download URLs).
          VERSION="${TAG#v}"

          # Pull the four brew-target checksums straight from the release the
          # `release` job just published. GH_TOKEN here is GITHUB_TOKEN —
          # same-repo read access. gh follows the asset redirect; no
          # hand-rolled curl URL to drift.
          download_sha() {
            gh release download "$TAG" \
              --repo onebrain-ai/onebrain-cli \
              --pattern "onebrain-$1.tar.gz.sha256" \
              --output - | awk '{print $1}'
          }
          SHA_MAC_ARM="$(download_sha aarch64-apple-darwin)"
          SHA_MAC_X86="$(download_sha x86_64-apple-darwin)"
          SHA_LINUX_ARM="$(download_sha aarch64-unknown-linux-gnu)"
          SHA_LINUX_X86="$(download_sha x86_64-unknown-linux-gnu)"

          BASE="https://github.com/onebrain-ai/onebrain-cli/releases/download/${TAG}"

          # Regenerate the formula from a fixed template — the target set is
          # stable, so a full rewrite is less brittle than in-place seds.
          # Heredoc lines sit at the run-block base indent so YAML's block
          # scalar strips them to column 0 (valid Ruby), while shell still
          # expands the ${...} vars. Ruby's #{...} has no $ so it stays literal.
          mkdir -p Formula
          cat > Formula/onebrain.rb <<FORMULA
          class Onebrain < Formula
            desc "Local-first Rust CLI for OneBrain — personal AI OS for Obsidian"
            homepage "https://onebrain.run"
            license any_of: ["MIT", "Apache-2.0"]

            on_macos do
              on_arm do
                url "${BASE}/onebrain-aarch64-apple-darwin.tar.gz"
                sha256 "${SHA_MAC_ARM}"
              end
              on_intel do
                url "${BASE}/onebrain-x86_64-apple-darwin.tar.gz"
                sha256 "${SHA_MAC_X86}"
              end
            end

            on_linux do
              on_arm do
                url "${BASE}/onebrain-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_LINUX_ARM}"
              end
              on_intel do
                url "${BASE}/onebrain-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_LINUX_X86}"
              end
            end

            def install
              bin.install "onebrain"
              generate_completions_from_executable(bin/"onebrain", "completions")
            end

            test do
              assert_match "onebrain #{version}", shell_output("#{bin}/onebrain --version")
            end
          end
          FORMULA

          # Commit to the tap's default branch via the Contents API (no local
          # clone / credential helper needed). These two calls hit the SIBLING
          # repo, so they run under TAP_TOKEN (GH_TOKEN=GITHUB_TOKEN can't see
          # homebrew-onebrain). Look up the current blob SHA so the PUT is an
          # update, not a create.
          CONTENT="$(base64 -w0 Formula/onebrain.rb)"
          CUR_SHA="$(GH_TOKEN="$TAP_TOKEN" gh api repos/onebrain-ai/homebrew-onebrain/contents/Formula/onebrain.rb --jq .sha)"
          GH_TOKEN="$TAP_TOKEN" gh api -X PUT repos/onebrain-ai/homebrew-onebrain/contents/Formula/onebrain.rb \
            -f message="onebrain ${VERSION}" \
            -f content="${CONTENT}" \
            -f sha="${CUR_SHA}"

  website-deploy:
    name: Trigger website redeploy
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Depends on `release`, NOT `npm-publish`: the website reads the version
    # from `onebrain-cli/releases/latest` (the GitHub Release), not from npm
    # (see website src/lib/version.ts). Gating on npm-publish would skip the
    # website rebuild whenever npm hiccups or no-ops on a recovery re-tag,
    # even though the GitHub Release — the website's actual source — is live.
    #
    # Stable tags only (gate explicitly so the job is self-documenting).
    # Fires the Cloudflare deploy hook so onebrain.run rebuilds and picks up
    # the new version.
    #
    # Secret `CF_WEBSITE_DEPLOY_HOOK`: the Cloudflare deploy-hook URL (the URL
    # itself is the credential). This is the same hook + secret name the
    # plugin repo used before v3.0.0 moved release ownership here; reuse the
    # existing hook, just store the secret on onebrain-cli.
    if: ${{ !contains(github.ref, '-') }}
    steps:
      - name: Trigger Cloudflare deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.CF_WEBSITE_DEPLOY_HOOK }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          if [ -z "${DEPLOY_HOOK_URL}" ]; then
            if [ "${GITHUB_REPOSITORY}" = "onebrain-ai/onebrain-cli" ]; then
              echo "::error::CF_WEBSITE_DEPLOY_HOOK secret is required on the canonical repo"
              exit 1
            fi
            echo "::warning::Skipping website rebuild on fork ${GITHUB_REPOSITORY} — secret not set"
            exit 0
          fi

          echo "Triggering website rebuild for v${VERSION}..."
          # --retry-connrefused (not --retry-all-errors): retry transient 5xx
          # + connection-refused; do NOT mask permanent 4xx misconfig errors.
          CURL_EXIT=0
          HTTP_CODE=$(curl -X POST "${DEPLOY_HOOK_URL}" \
            -sS \
            -o response.txt \
            -w "%{http_code}" \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 3 --retry-delay 5 --retry-connrefused) || CURL_EXIT=$?

          if [ "${CURL_EXIT}" -ne 0 ]; then
            echo "::error::curl failed (exit ${CURL_EXIT}) — network/DNS/TLS issue, not an HTTP error"
            exit 1
          fi
          if ! [[ "${HTTP_CODE}" =~ ^[0-9]+$ ]]; then
            echo "::error::Unexpected HTTP code value: '${HTTP_CODE}'"
            exit 1
          fi
          if [ "${HTTP_CODE}" -ge 200 ] && [ "${HTTP_CODE}" -lt 300 ]; then
            echo "Website rebuild triggered (HTTP ${HTTP_CODE}) — live within 1-2 min"
          else
            echo "::error::Deploy hook returned HTTP ${HTTP_CODE}"
            [ -s response.txt ] && head -c 2000 response.txt
            exit 1
          fi
