name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            apt: musl-tools
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            archive: zip
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install musl tools
        if: matrix.apt
        env:
          APT_PACKAGES: ${{ matrix.apt }}
        run: sudo apt-get update && sudo apt-get install -y "$APT_PACKAGES"

      - name: Install aarch64 linux cross-compiler
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          {
            echo '[target.aarch64-unknown-linux-gnu]'
            echo 'linker = "aarch64-linux-gnu-gcc"'
          } >> .cargo/config.toml

      - name: Build release binary
        run: cargo build --release --target "$TARGET" -p onebrain-cli

      - name: Strip binary (native Unix)
        if: matrix.archive == 'tar.gz' && !matrix.cross
        run: strip "target/$TARGET/release/onebrain"

      - name: Strip aarch64 linux binary
        if: matrix.cross
        run: aarch64-linux-gnu-strip "target/$TARGET/release/onebrain"

      - name: Package tar.gz + sha256
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist
          ARCHIVE="onebrain-${TARGET}.tar.gz"
          tar -czf "dist/$ARCHIVE" -C "target/${TARGET}/release" onebrain
          ( cd dist && shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256" )

      - name: Package zip + sha256 (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $archive = "onebrain-$env:TARGET.zip"
          Compress-Archive `
            -Path "target/$env:TARGET/release/onebrain.exe" `
            -DestinationPath "dist/$archive"
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$archive").Hash.ToLower()
          "$hash  $archive" | Out-File -Encoding ascii "dist/$archive.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: onebrain-${{ matrix.target }}
          path: dist/

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Determine version + prerelease flag
        id: meta
        env:
          REF: ${{ github.ref }}
        shell: bash
        run: |
          VERSION="${REF#refs/tags/}"
          case "$VERSION" in
            *-alpha*|*-beta*|*-rc*) PRERELEASE=true ;;
            *) PRERELEASE=false ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          ARGS=()
          if [ "$PRERELEASE" = "true" ]; then
            ARGS+=(--prerelease)
          fi
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            "${ARGS[@]}" \
            artifacts/*
