[workspace]
members = ["crates/*"]
default-members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "3.2.18"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["OneBrain Contributors"]
repository = "https://github.com/onebrain-ai/onebrain-cli"
publish = false

[workspace.dependencies]
# Internal path deps
onebrain-core  = { path = "crates/onebrain-core" }
onebrain-fs    = { path = "crates/onebrain-fs" }
onebrain-cache = { path = "crates/onebrain-cache" }

# Foundation (Slice 1)
serde       = { version = "1", features = ["derive"] }
serde_yaml  = { package = "serde_yaml_ng", version = "0.10" }
serde_json  = { version = "1", features = ["preserve_order"] }
thiserror   = "1"
anyhow      = "1"
chrono      = { version = "0.4", features = ["serde"] }
clap        = { version = "4", features = ["derive"] }

# Filesystem (Slice 1 partial · used by count_unembedded)
walkdir   = "2"

# Binary lookup (used by doctor qmd check + scheduler command-mode binary resolution)
which     = "8"

# Bounded child-process wait (v3 perf rec #2 — replaces 100 ms try_wait poll in doctor qmd check)
wait-timeout = "0.2"

# Semver comparison for `onebrain update` (prerelease-aware so alpha users
# don't get auto-downgraded to a stable release with a lower semver).
semver    = "1"

# HTTP client (Slice 11 · update · GitHub releases API · Slice 13 · vault-sync tarball)
# v3.2.18: reqwest → ureq. ureq is a blocking, synchronous client, so swapping it
# in drops the entire async stack (tokio · hyper · h2 · tower · tower-http ·
# hyper-rustls · hyper-util) from the release binary — these were pulled in ONLY
# by reqwest. TLS still rustls (ureq default features: rustls + ring + webpki-roots
# + gzip). JSON is parsed via the existing serde_json dep, so ureq's `json` feature
# is left off. The daemon (v3.3) re-introduces tokio deliberately for its async
# RPC server — keeping it out of the one-shot CLI hot path until then.
ureq = "3"

# SHA-256 verification of the self-update binary (v3.1.4 · onebrain-fs update install path)
sha2 = "0.10"

# Regex (Slice 8 scheduler · cron + at field validation · pre-compiled with OnceLock · v3.2 note search --mode regex)
regex     = "1"

# Glob matching (v3.2 `note find` — path globs like `**/topic-*.md`)
globset   = "0.4"

# Order-preserving map (Slice 8 scheduler · YAML insertion order for skill-mode args)
indexmap  = { version = "2", features = ["serde"] }

# Portable homedir resolution (Slice 8 scheduler plist path · Slice 13 cache prune)
dirs      = "5"

# Direct getuid() on Unix for launchd plist UID field (Slice 8)
libc      = "0.2"

# Interactive prompts (Slice 10 · init wizard)
inquire   = "0.7"

# Slice 13 — vault-sync (tarball extraction + progress UI + url encoding)
tar         = "0.4"
flate2      = "1"
indicatif   = "0.17"
is-terminal = "0.4"
urlencoding = "2"

# Test infrastructure
filetime          = "0.2"
tempfile          = "3"
insta             = { version = "1", features = ["json"] }
assert_cmd        = "2"
predicates        = "3"
pretty_assertions = "1"
mockito           = "1"

[profile.release]
# v3.2.15: switched from `opt-level = 3` (implicit default) + `lto = "thin"` to
# `opt-level = "z"` + `lto = "fat"` for the v3.2.x final cut. Trims ~20–30%
# off the release binary (~5.4 MB → ~3.8–4.3 MB). The CLI's hot paths are
# I/O-bound (HTTP fetches, file IO, regex scans on note-search), so size-
# optimised codegen carries no measurable runtime hit for sub-second runs.
opt-level   = "z"
strip       = "symbols"
lto         = "fat"
codegen-units = 1
panic       = "abort"
