[workspace]
members = ["crates/*", "tests/parity"]
default-members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "3.0.0"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["OneBrain Contributors"]
repository = "https://github.com/onebrain-ai/onebrain-cli"
publish = false

[workspace.dependencies]
# Internal path deps
onebrain-core  = { path = "crates/onebrain-core" }
onebrain-fs    = { path = "crates/onebrain-fs" }
onebrain-cache = { path = "crates/onebrain-cache" }

# Foundation (Slice 1)
serde       = { version = "1", features = ["derive"] }
serde_yaml  = "0.9"
serde_json  = { version = "1", features = ["preserve_order"] }
thiserror   = "1"
anyhow      = "1"
chrono      = { version = "0.4", features = ["serde"] }
clap        = { version = "4", features = ["derive"] }

# v3.1 forward-compat (binary only)
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# Filesystem (Slice 1 partial · used by count_unembedded)
walkdir   = "2"

# Binary lookup (used by doctor qmd check to mirror Bun.which fallback to ~/.bun/bin)
which     = "8"

# HTTP client (Slice 11 · update · GitHub releases API)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }

# Test infrastructure
filetime          = "0.2"
tempfile          = "3"
insta             = { version = "1", features = ["json"] }
assert_cmd        = "2"
predicates        = "3"
pretty_assertions = "1"
mockito           = "1"

[profile.release]
strip       = "symbols"
lto         = "thin"
codegen-units = 1
panic       = "abort"
