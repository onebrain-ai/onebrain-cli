[workspace]
members = ["crates/*"]
default-members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "3.3.8"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["OneBrain Contributors"]
repository = "https://github.com/onebrain-ai/onebrain-cli"
publish = false

[workspace.dependencies]
# Internal path deps
onebrain-core  = { path = "crates/onebrain-core" }
onebrain-fs    = { path = "crates/onebrain-fs" }
onebrain-cache = { path = "crates/onebrain-cache" }

# Foundation (Slice 1)
serde       = { version = "1", features = ["derive"] }
serde_yaml  = { package = "serde_yaml_ng", version = "0.10" }
serde_json  = { version = "1", features = ["preserve_order"] }
thiserror   = "1"
anyhow      = "1"
chrono      = { version = "0.4", features = ["serde"] }
clap        = { version = "4", features = ["derive", "string"] }
clap_complete = "4"

# Filesystem (Slice 1 partial · used by count_unembedded)
walkdir   = "2"

# Binary lookup (used by doctor qmd check + scheduler command-mode binary resolution)
which     = "8"

# Bounded child-process wait (v3 perf rec #2 — replaces 100 ms try_wait poll in doctor qmd check)
wait-timeout = "0.2"

# Semver comparison for `onebrain update` (prerelease-aware so alpha users
# don't get auto-downgraded to a stable release with a lower semver).
semver    = "1"

# HTTP client (Slice 11 · update · GitHub releases API · Slice 13 · vault-sync tarball)
# v3.2.18: reqwest → ureq. ureq is a blocking, synchronous client, so swapping it
# in drops the entire async stack (tokio · hyper · h2 · tower · tower-http ·
# hyper-rustls · hyper-util) from the release binary — these were pulled in ONLY
# by reqwest. TLS still rustls (ureq default features: rustls + ring + webpki-roots
# + gzip). JSON is parsed via the existing serde_json dep, so ureq's `json` feature
# is left off. The daemon (v3.3) re-introduces tokio deliberately for its async
# RPC server — keeping it out of the one-shot CLI hot path until then.
ureq = "3"

# SHA-256 verification of the self-update binary (v3.1.4 · onebrain-fs update install path)
sha2 = "0.10"

# Regex (Slice 8 scheduler · cron + at field validation · pre-compiled with OnceLock · v3.2 note search --mode regex)
regex     = "1"

# Glob matching (v3.2 `note find` — path globs like `**/topic-*.md`)
globset   = "0.4"

# Order-preserving map (Slice 8 scheduler · YAML insertion order for skill-mode args)
indexmap  = { version = "2", features = ["serde"] }

# Portable homedir resolution (Slice 8 scheduler plist path · Slice 13 cache prune)
dirs      = "5"

# Direct getuid() on Unix for launchd plist UID field (Slice 8)
libc      = "0.2"

# Structured logging for the v3.3 daemon (`daemon __run` writes to a file).
# `tracing` is the facade; `tracing-subscriber` provides the file writer + env
# filter. Kept out of the one-shot CLI hot path — only the detached daemon
# child initialises a subscriber.
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Unix syscalls for the v3.3 daemon: kill(pid, 0) liveness probe, SIGTERM,
# and setsid() for the detached spawn. Gated to `cfg(unix)` in the crate so
# Windows still builds (its daemon lands in a later step). Features pared to
# just `signal` + `process` to keep the dependency surface small.
nix       = { version = "0.29", default-features = false, features = ["signal", "process"] }

# ── v3.3 daemon step 2 — async HTTP surface (serve + daemon __run) ──────────
# The v3.2.18 CHANGELOG dropped the async stack (reqwest → ureq) to shrink the
# one-shot CLI binary. The daemon RE-INTRODUCES tokio + axum deliberately: a
# persistent local server is inherently async (one runtime drives many
# concurrent connections, graceful shutdown, signal handling). The binary-size
# cost is the conscious v3.3 daemon tradeoff — it only weighs on the daemon
# code path, not the everyday one-shot CLI commands.
#
# tokio features pared to what the server needs: multi-thread runtime + the
# `#[tokio::main]`-style `block_on`, async TCP (`net`), Unix signal handling
# (`signal`, for SIGTERM/Ctrl-C graceful shutdown), and timers (`time`).
# `process` + `io-util` + `sync` (v3.4 chat): async child spawn for `claude -p`,
# line-by-line stdout reads, and the concurrency Semaphore.
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "net",
    "signal",
    "time",
    "process",
    "io-util",
    "sync",
] }

# Async stream construction (v3.4 chat) — the `stream!{}` macro builds the SSE
# body that reads claude's stdout line-by-line and yields events. `futures-core`
# provides the `Stream` trait used in the handler signature.
async-stream = "0.3"
futures-core = "0.3"
# axum 0.8 — ergonomic router + extractors over hyper. Default features give us
# JSON (`Json`), query extraction, and the matched-path router we need.
axum  = "0.8"
# tower — the `Service`/`Layer` abstraction axum builds on. We use it directly
# for the per-route auth middleware (`from_fn`) and `ServiceExt::oneshot` in
# tests (drive the Router without binding a socket).
tower = "0.5"
# tower-http `fs` feature — `ServeDir`/`ServeFile` for the static SPA dist.
tower-http = { version = "0.6", features = ["fs"] }

# Interactive prompts (Slice 10 · init wizard)
inquire   = "0.7"

# Slice 13 — vault-sync (tarball extraction + progress UI + url encoding)
tar         = "0.4"
flate2      = "1"
indicatif   = "0.17"
is-terminal = "0.4"
urlencoding = "2"

# Test infrastructure
filetime          = "0.2"
tempfile          = "3"
insta             = { version = "1", features = ["json"] }
assert_cmd        = "2"
predicates        = "3"
pretty_assertions = "1"
mockito           = "1"

[profile.release]
# v3.2.15: switched from `opt-level = 3` (implicit default) + `lto = "thin"` to
# `opt-level = "z"` + `lto = "fat"` for the v3.2.x final cut. Trims ~20–30%
# off the release binary (~5.4 MB → ~3.8–4.3 MB). The CLI's hot paths are
# I/O-bound (HTTP fetches, file IO, regex scans on note-search), so size-
# optimised codegen carries no measurable runtime hit for sub-second runs.
opt-level   = "z"
strip       = "symbols"
lto         = "fat"
codegen-units = 1
panic       = "abort"
