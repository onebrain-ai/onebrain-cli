[workspace]
members = ["crates/*"]
default-members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "3.1.4"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["OneBrain Contributors"]
repository = "https://github.com/onebrain-ai/onebrain-cli"
publish = false

[workspace.dependencies]
# Internal path deps
onebrain-core  = { path = "crates/onebrain-core" }
onebrain-fs    = { path = "crates/onebrain-fs" }
onebrain-cache = { path = "crates/onebrain-cache" }

# Foundation (Slice 1)
serde       = { version = "1", features = ["derive"] }
serde_yaml  = "0.9"
serde_json  = { version = "1", features = ["preserve_order"] }
thiserror   = "1"
anyhow      = "1"
chrono      = { version = "0.4", features = ["serde"] }
clap        = { version = "4", features = ["derive", "env"] }

# v3.1 forward-compat (binary only)
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# Filesystem (Slice 1 partial · used by count_unembedded)
walkdir   = "2"

# Binary lookup (used by doctor qmd check + scheduler command-mode binary resolution)
which     = "8"

# Bounded child-process wait (v3 perf rec #2 — replaces 100 ms try_wait poll in doctor qmd check)
wait-timeout = "0.2"

# Semver comparison for `onebrain update` (prerelease-aware so alpha users
# don't get auto-downgraded to a stable release with a lower semver).
semver    = "1"

# HTTP client (Slice 11 · update · GitHub releases API · Slice 13 · vault-sync tarball)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }

# SHA-256 verification of the self-update binary (v3.1.4 · onebrain-fs update install path)
sha2 = "0.10"

# Regex (Slice 8 scheduler · cron + at field validation · pre-compiled with OnceLock)
regex     = "1"

# Order-preserving map (Slice 8 scheduler · YAML insertion order for skill-mode args)
indexmap  = { version = "2", features = ["serde"] }

# Portable homedir resolution (Slice 8 scheduler plist path · Slice 13 cache prune)
dirs      = "5"

# Direct getuid() on Unix for launchd plist UID field (Slice 8)
libc      = "0.2"

# Interactive prompts (Slice 10 · init wizard)
inquire   = "0.7"

# Slice 13 — vault-sync (tarball extraction + progress UI + url encoding)
tar         = "0.4"
flate2      = "1"
indicatif   = "0.17"
is-terminal = "0.4"
urlencoding = "2"

# Test infrastructure
filetime          = "0.2"
tempfile          = "3"
insta             = { version = "1", features = ["json"] }
assert_cmd        = "2"
predicates        = "3"
pretty_assertions = "1"
mockito           = "1"

[profile.release]
strip       = "symbols"
lto         = "thin"
codegen-units = 1
panic       = "abort"
